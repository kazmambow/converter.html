<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>OBJ → GLB Converter</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #111;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overflow: hidden;
    }

    #app {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    #viewer {
      position: relative;
      flex: 1;
      min-height: 0;
      background: #1a1a1a;
    }

    #viewer canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    #hint {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #777;
      text-align: center;
      pointer-events: none;
    }

    #panel {
      background: #181818;
      border-top: 1px solid #333;
      padding: 12px;
      max-height: 46vh;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    h1 {
      font-size: 17px;
      margin: 0 0 12px;
    }

    .row {
      margin-bottom: 10px;
    }

    .label {
      display: block;
      font-size: 12px;
      color: #aaa;
      margin-bottom: 5px;
    }

    input[type="file"] {
      display: block;
      width: 100%;
      font-size: 14px;
    }

    .texture-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 9px;
      padding: 13px;
      font-size: 15px;
      font-weight: 600;
      color: white;
      background: #333;
    }

    #exportButton {
      margin-top: 4px;
      background: #0a84ff;
    }

    #exportButton:disabled {
      background: #333;
      color: #777;
    }

    #status {
      margin-top: 10px;
      min-height: 18px;
      font-size: 12px;
      color: #aaa;
    }
  </style>
</head>

<body>

<div id="app">

  <div id="viewer">
    <div id="hint">
      OBJを選択してください
    </div>
  </div>

  <div id="panel">

    <h1>OBJ → GLB Converter</h1>

    <div class="row">
      <span class="label">OBJ</span>
      <input id="objInput" type="file" accept=".obj">
    </div>

    <div class="texture-grid">

      <div class="row">
        <span class="label">Base Color</span>
        <input id="baseColorInput" type="file" accept="image/*">
      </div>

      <div class="row">
        <span class="label">Normal</span>
        <input id="normalInput" type="file" accept="image/*">
      </div>

      <div class="row">
        <span class="label">Roughness</span>
        <input id="roughnessInput" type="file" accept="image/*">
      </div>

      <div class="row">
        <span class="label">Metallic</span>
        <input id="metallicInput" type="file" accept="image/*">
      </div>

      <div class="row">
        <span class="label">AO</span>
        <input id="aoInput" type="file" accept="image/*">
      </div>

      <div class="row">
        <span class="label">Emissive</span>
        <input id="emissiveInput" type="file" accept="image/*">
      </div>

    </div>

    <button id="exportButton" disabled>
      GLBを書き出す
    </button>

    <div id="status"></div>

  </div>
</div>


<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
  }
}
</script>


<script type="module">

import * as THREE from 'three';
import { OBJLoader } from 'three/addons/loaders/OBJLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';


const viewer = document.getElementById('viewer');
const hint = document.getElementById('hint');
const status = document.getElementById('status');

const objInput = document.getElementById('objInput');

const baseColorInput =
  document.getElementById('baseColorInput');

const normalInput =
  document.getElementById('normalInput');

const roughnessInput =
  document.getElementById('roughnessInput');

const metallicInput =
  document.getElementById('metallicInput');

const aoInput =
  document.getElementById('aoInput');

const emissiveInput =
  document.getElementById('emissiveInput');

const exportButton =
  document.getElementById('exportButton');


/* -------------------------
   THREE.JS
------------------------- */

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x202020);


const camera = new THREE.PerspectiveCamera(
  45,
  1,
  0.01,
  10000
);

camera.position.set(3, 2, 5);


const renderer = new THREE.WebGLRenderer({
  antialias: true,
  preserveDrawingBuffer: true
});

renderer.setPixelRatio(
  Math.min(window.devicePixelRatio, 2)
);

renderer.outputColorSpace = THREE.SRGBColorSpace;

viewer.appendChild(renderer.domElement);


const controls = new OrbitControls(
  camera,
  renderer.domElement
);

controls.enableDamping = true;


/* -------------------------
   LIGHT
------------------------- */

const hemiLight = new THREE.HemisphereLight(
  0xffffff,
  0x444444,
  2.5
);

scene.add(hemiLight);


const keyLight = new THREE.DirectionalLight(
  0xffffff,
  3
);

keyLight.position.set(4, 6, 5);

scene.add(keyLight);


const fillLight = new THREE.DirectionalLight(
  0xffffff,
  1.5
);

fillLight.position.set(-4, 2, -3);

scene.add(fillLight);


/* -------------------------
   GRID
------------------------- */

const grid = new THREE.GridHelper(
  10,
  20,
  0x555555,
  0x333333
);

scene.add(grid);


/* -------------------------
   MATERIAL
------------------------- */

const material = new THREE.MeshStandardMaterial({
  color: 0xffffff,
  roughness: 0.7,
  metalness: 0
});


let loadedObject = null;


/* -------------------------
   OBJ LOAD
------------------------- */

objInput.addEventListener('change', async (event) => {

  const file = event.target.files[0];

  if (!file) return;

  status.textContent = 'OBJを読み込んでいます…';

  try {

    const text = await file.text();

    const loader = new OBJLoader();

    const object = loader.parse(text);


    if (loadedObject) {
      scene.remove(loadedObject);
    }


    object.traverse((child) => {

      if (child.isMesh) {

        child.material = material;

      }

    });


    loadedObject = object;

    scene.add(object);

    fitCameraToObject(object);

    hint.style.display = 'none';

    exportButton.disabled = false;

    status.textContent =
      'OBJを読み込みました';

  }

  catch (error) {

    console.error(error);

    status.textContent =
      'OBJの読み込みに失敗しました';

  }

});


/* -------------------------
   TEXTURE LOADER
------------------------- */

async function loadTexture(file, colorTexture = false) {

  if (!file) return null;

  const url = URL.createObjectURL(file);

  const loader = new THREE.TextureLoader();

  const texture = await loader.loadAsync(url);

  URL.revokeObjectURL(url);

  texture.flipY = false;

  if (colorTexture) {
    texture.colorSpace = THREE.SRGBColorSpace;
  }

  return texture;
}


/* -------------------------
   BASE COLOR
------------------------- */

baseColorInput.addEventListener(
  'change',
  async (event) => {

    const file = event.target.files[0];

    material.map =
      await loadTexture(file, true);

    material.needsUpdate = true;

    status.textContent =
      'Base Colorを適用しました';

  }
);


/* -------------------------
   NORMAL
------------------------- */

normalInput.addEventListener(
  'change',
  async (event) => {

    const file = event.target.files[0];

    material.normalMap =
      await loadTexture(file);

    material.needsUpdate = true;

    status.textContent =
      'Normal Mapを適用しました';

  }
);


/* -------------------------
   ROUGHNESS
------------------------- */

roughnessInput.addEventListener(
  'change',
  async (event) => {

    const file = event.target.files[0];

    material.roughnessMap =
      await loadTexture(file);

    material.roughness = 1;

    material.needsUpdate = true;

    status.textContent =
      'Roughness Mapを適用しました';

  }
);


/* -------------------------
   METALLIC
------------------------- */

metallicInput.addEventListener(
  'change',
  async (event) => {

    const file = event.target.files[0];

    material.metalnessMap =
      await loadTexture(file);

    material.metalness = 1;

    material.needsUpdate = true;

    status.textContent =
      'Metallic Mapを適用しました';

  }
);


/* -------------------------
   AO
------------------------- */

aoInput.addEventListener(
  'change',
  async (event) => {

    const file = event.target.files[0];

    material.aoMap =
      await loadTexture(file);

    material.aoMapIntensity = 1;

    material.needsUpdate = true;

    status.textContent =
      'AO Mapを適用しました';

  }
);


/* -------------------------
   EMISSIVE
------------------------- */

emissiveInput.addEventListener(
  'change',
  async (event) => {

    const file = event.target.files[0];

    material.emissiveMap =
      await loadTexture(file, true);

    material.emissive.set(0xffffff);

    material.emissiveIntensity = 1;

    material.needsUpdate = true;

    status.textContent =
      'Emissive Mapを適用しました';

  }
);


/* -------------------------
   CAMERA FIT
------------------------- */

function fitCameraToObject(object) {

  const box =
    new THREE.Box3().setFromObject(object);

  const size =
    box.getSize(new THREE.Vector3());

  const center =
    box.getCenter(new THREE.Vector3());

  const maxSize =
    Math.max(size.x, size.y, size.z);

  const distance =
    maxSize * 2;


  camera.position.set(
    center.x + distance,
    center.y + distance * 0.6,
    center.z + distance
  );

  camera.near =
    Math.max(maxSize / 1000, 0.001);

  camera.far =
    Math.max(maxSize * 100, 100);

  camera.updateProjectionMatrix();


  controls.target.copy(center);

  controls.update();

}


/* -------------------------
   GLB EXPORT
------------------------- */

exportButton.addEventListener(
  'click',
  async () => {

    if (!loadedObject) return;

    status.textContent =
      'GLBを生成しています…';


    try {

      const exporter =
        new GLTFExporter();


      const result =
        await exporter.parseAsync(
          loadedObject,
          {
            binary: true,
            onlyVisible: true
          }
        );


      const blob =
        new Blob(
          [result],
          {
            type: 'model/gltf-binary'
          }
        );


      const url =
        URL.createObjectURL(blob);


      const link =
        document.createElement('a');

      link.href = url;

      link.download = 'model.glb';

      document.body.appendChild(link);

      link.click();

      link.remove();


      setTimeout(() => {
        URL.revokeObjectURL(url);
      }, 1000);


      status.textContent =
        'GLBを生成しました';

    }

    catch (error) {

      console.error(error);

      status.textContent =
        'GLBの生成に失敗しました';

    }

  }
);


/* -------------------------
   RESIZE
------------------------- */

function resize() {

  const width =
    viewer.clientWidth;

  const height =
    viewer.clientHeight;


  renderer.setSize(
    width,
    height,
    false
  );


  camera.aspect =
    width / height;

  camera.updateProjectionMatrix();

}


window.addEventListener(
  'resize',
  resize
);

resize();


/* -------------------------
   RENDER
------------------------- */

function animate() {

  requestAnimationFrame(animate);

  controls.update();

  renderer.render(
    scene,
    camera
  );

}

animate();

</script>

</body>
</html>
